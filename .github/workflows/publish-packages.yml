name: Publish Packages

# Publishes the shared packages this repo owns — `@cogni-dao/work-items`,
# `@cogni-dao/knowledge-store`, `@cogni-dao/knowledge-base` — so node repos can
# DEPEND on them instead of vendoring their source. Four divergent copies of the
# work-items adapter existed across the fleet when bug.5358 was audited, and a
# single availability fix then cost nine PRs across six repositories (story.5069).
# The knowledge packages are the same shape of liability, one tier down.
#
# ONE LANE, N PACKAGES. The per-package registry lives in `env.PACKAGES` below —
# the single source of truth for name, directory, and tag prefix. A `select` job
# resolves the pushed tag to exactly one registry entry and emits it as the
# publish matrix, so every leg that runs is a leg that genuinely should run and no
# step needs a leg-selection `if`. That matters: `matrix` is not available in
# `jobs.<id>.if`, so a static matrix could only be gated step-by-step, which would
# force every mutating step's `if` into a compound expression and break the
# `github.event_name == 'push'` exact-equality assertion that keeps this lane
# fail-closed. Registry-in-YAML also keeps the workflow checker's inputs to
# workflow YAML + repo-policy, which is all its self-test harness copies.
#
# Not covered by the CI/CD freeze: docs/spec/cicd-platform-boundary.md scopes
# that to the operator control plane, and a node's own GitHub Actions are
# explicitly exempt. This workflow publishes a package; it deploys nothing.
#
# DISTRIBUTION IS A RELEASE ASSET, AND ONLY A RELEASE ASSET. A public repo
# serves one anonymously, so a fork can `pnpm install` with no credentials.
# GitHub Packages' npm registry cannot — it returns 401 even for a public
# package in a public repo — and this repo exists to be forked, so a registry
# that breaks every fork's build is disqualified. A second, `continue-on-error`
# registry publish used to run here as a "secondary option"; it is removed. A
# step that cannot fail proves nothing, it published `access: restricted` (a
# PRIVATE package) while the comment beside it advertised public anonymous
# reads, and keeping it forced `packages: write` into this workflow for no
# reachable consumer.
#
# THE PUBLISH PATH IS FAIL-CLOSED. Every assertion below exists because the
# alternative is a consumer pinning bytes nobody gated:
#   - the tagged commit must have passed every required check in repo-policy
#   - the tag must match the package version
#   - the Release must not already exist (a version is immutable, or it is not a version)
#   - the tarball must contain every entrypoint its own `exports` declares
#   - the exact tarball is attested before it is uploaded
# `workflow_dispatch` can pack and verify but can NEVER publish.
on:
  push:
    tags:
      - "work-items-v*"
      - "knowledge-store-v*"
      - "knowledge-base-v*"
  # Rehearsal only. Every publishing step below is gated on `push`, so a
  # dispatch packs the tarball and runs the artifact assertions against it
  # without creating a Release, attesting anything, or moving a version. A
  # dispatch rehearses EVERY registry entry, because the thing worth rehearsing
  # is that each package can still pack and satisfy its own `exports`. The
  # previous `dry_run: false` input could publish to the registry off any
  # branch, which skipped the tag/version check (itself `push`-only) — a
  # publish with no tag correspondence and no version proof.
  workflow_dispatch:

permissions:
  # `contents: write` creates the Release that carries the tarball.
  contents: write
  # Sigstore OIDC + attestation storage for build provenance. `npm publish
  # --provenance` only works against registry.npmjs.org, so the equivalent for
  # a Release asset is `actions/attest-build-provenance` over the exact file.
  id-token: write
  attestations: write

concurrency:
  # `github.ref` is the tag on a push, so the group is unique per package+version
  # and two different packages' tags never serialize behind each other.
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match ci.yaml's NODE_VERSION and the Dockerfile's `node:22-alpine`.
  # This workflow built on 24 while the artifact was gated on 22 and runs on 22,
  # so the published dist and .d.ts files came off a toolchain no consumer uses.
  NODE_VERSION: "22"
  # THE PACKAGE REGISTRY. Adding a publishable package means adding one entry
  # here AND its `<tagPrefix>*` filter to `on.push.tags` above;
  # scripts/check-node-ci-workflow.mjs fails the build if those two drift apart
  # in either direction, so neither an unselectable tag nor an untaggable
  # package can ship.
  PACKAGES: >-
    [{"name":"@cogni-dao/work-items","dir":"packages/work-items","tagPrefix":"work-items-v"},
     {"name":"@cogni-dao/knowledge-store","dir":"packages/knowledge-store","tagPrefix":"knowledge-store-v"},
     {"name":"@cogni-dao/knowledge-base","dir":"packages/knowledge-base","tagPrefix":"knowledge-base-v"}]

jobs:
  # Resolve WHICH packages this run acts on, before anything is built. A push
  # must map to exactly one registry entry: zero means a tag filter fires a run
  # nothing can publish, and more than one means two prefixes overlap and the
  # tag is ambiguous about which version it certifies. Both are configuration
  # bugs, and both fail here rather than half-publishing.
  select:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Resolve the publish matrix from the tag
        id: select
        run: |
          set -euo pipefail
          node -e '
            const registry = JSON.parse(process.env.PACKAGES);
            if (!Array.isArray(registry) || registry.length === 0) {
              console.error("env.PACKAGES must be a non-empty JSON array");
              process.exit(1);
            }
            let selected = registry;
            if (process.env.GITHUB_EVENT_NAME === "push") {
              const ref = process.env.GITHUB_REF_NAME;
              const matched = registry.filter((p) => ref.startsWith(p.tagPrefix));
              if (matched.length !== 1) {
                console.error(
                  `tag ${ref} matches ${matched.length} registry entries (need exactly 1): ` +
                    JSON.stringify(matched.map((p) => p.tagPrefix))
                );
                process.exit(1);
              }
              selected = matched;
            }
            console.log(`selected: ${selected.map((p) => p.name).join(", ")}`);
            require("node:fs").appendFileSync(
              process.env.GITHUB_OUTPUT,
              `packages=${JSON.stringify(selected)}\n`
            );
          '

  publish:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      # One package's failure must not cancel another's in-flight publish.
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.select.outputs.packages) }}
    env:
      PKG_NAME: ${{ matrix.pkg.name }}
      PKG_DIR: ${{ matrix.pkg.dir }}
      TAG_PREFIX: ${{ matrix.pkg.tagPrefix }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      # A published version must already be gated by this repo's required checks
      # — including the real-Doltgres lane from task.5199. The previous version
      # of this workflow asserted that in a comment ("ci.yaml is the gate that
      # matters and runs on the commit being tagged") and nowhere in code. A tag
      # can be pushed at any commit, including one that never ran CI, so that was
      # an assumption. story.5069 requires that a node must not be able to
      # consume a version that was never gated; this is where that is enforced.
      - name: Tagged commit must have passed every required check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion}' > /tmp/check-runs.ndjson
          node -e '
            const fs = require("node:fs");
            const policy = JSON.parse(fs.readFileSync(".cogni/repo-policy.json", "utf8"));
            const required = policy?.ruleset?.requiredStatusChecks?.contexts ?? [];
            if (required.length === 0) {
              console.error("repo-policy declares no required checks - refusing to publish ungated bytes");
              process.exit(1);
            }
            const runs = fs.readFileSync("/tmp/check-runs.ndjson", "utf8")
              .split("\n").filter(Boolean).map((line) => JSON.parse(line));
            const problems = [];
            for (const context of required) {
              // Latest attempt wins: a re-run that went green must count, and the
              // API returns every attempt for the commit.
              const matching = runs.filter((run) => run.name === context);
              if (matching.length === 0) {
                problems.push(`${context}: never reported on this commit`);
                continue;
              }
              const passed = matching.some(
                (run) => run.status === "completed" && run.conclusion === "success"
              );
              if (!passed) {
                const seen = matching.map((r) => `${r.status}/${r.conclusion}`).join(", ");
                problems.push(`${context}: ${seen}`);
              }
            }
            if (problems.length > 0) {
              console.error("refusing to publish: required checks not green on " + process.env.COMMIT_SHA);
              for (const problem of problems) console.error("  " + problem);
              process.exit(1);
            }
            console.log(`all ${required.length} required checks green on ${process.env.COMMIT_SHA}`);
          '

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm packages:build`, NOT the package's own `build`. tsup is configured
      # `dts: false` on every entry, so the .d.ts files that `exports.*.types`
      # points at come from the `tsc -b` half of this script. Running only the
      # package build publishes JS with no declarations, and every TypeScript
      # consumer then fails to resolve the module — 0.1.1 shipped exactly that.
      - name: Build the workspace packages
        run: pnpm packages:build

      - name: Unit tests
        run: pnpm --filter "$PKG_NAME" test

      - name: Tag must match the package version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./' + process.env.PKG_DIR + '/package.json').version")"
          tag="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag ${TAG_PREFIX}${tag} does not match package version $pkg"
            exit 1
          fi
          echo "publishing ${PKG_NAME}@$pkg"

      # A VERSION IS IMMUTABLE, OR IT IS NOT A VERSION. The previous step ran
      # `gh release create ... || gh release upload --clobber`, so re-running the
      # tag silently replaced the asset bytes at an existing version. Every
      # consumer pins that URL, so a clobber either breaks all of them on an
      # integrity mismatch or — worse, for anyone installing fresh — hands them
      # different code under a version they already reviewed. Publishing a
      # corrected NEW version is the only safe fix for a bad release, which is
      # also how every npm registry behaves (409 on republish).
      - name: Release must not already exist
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; a published version is immutable. Bump the version and tag again."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is unpublished"

      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist-pack
          pnpm --filter "$PKG_NAME" exec npm pack --pack-destination "$PWD/dist-pack"
          tgz="$(ls dist-pack/*.tgz)"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "packed $tgz"

      # Verify the ARTIFACT, not the build that produced it. 0.1.1 published with
      # exports.types pointing at .d.ts files the tarball did not contain, which
      # a green build could not reveal. Assert every declared entrypoint is
      # actually inside the tarball before anything depends on it.
      - name: Tarball must contain every declared entrypoint
        run: |
          set -euo pipefail
          tar tzf "${{ steps.pack.outputs.tgz }}" | sed 's|^package/||' | sort -u > /tmp/have.txt
          node -e '
            const fs = require("node:fs");
            const pkg = require(`${process.cwd()}/${process.env.PKG_DIR}/package.json`);
            const want = new Set();
            for (const map of Object.values(pkg.exports ?? {})) {
              for (const key of ["types", "import", "default"]) {
                if (map?.[key]) want.add(map[key].replace(/^\.\//, ""));
              }
            }
            if (want.size === 0) {
              console.error("no exports declared - nothing to verify");
              process.exit(1);
            }
            fs.writeFileSync("/tmp/want.txt", [...want].sort().join("\n") + "\n");
            console.log(`${want.size} declared entrypoints to verify`);
          '
          missing="$(comm -23 /tmp/want.txt /tmp/have.txt || true)"
          if [ -n "$missing" ]; then
            echo "::error::tarball is missing declared entrypoints:"
            echo "$missing"
            exit 1
          fi
          echo "all declared entrypoints present"

      # The licence is not optional metadata on a publicly downloadable artifact.
      # Every source file in this repo carries
      # `SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0`, so a tarball
      # that omits it misrepresents the terms under which it may be used.
      - name: Tarball must carry its licence
        run: |
          set -euo pipefail
          # Materialise the listing first. `grep -q` exits at its first match and
          # closes the pipe, `tar` then dies with EPIPE, and `pipefail` promotes
          # that to the pipeline's status — so `! <pipeline>` fired the error
          # branch even though the LICENSE was present. Size-dependent, which is
          # why it spared small tarballs and bit knowledge-store v0.1.0 and
          # work-items v0.1.3 once they grew past tar's buffer.
          tar tzf "${{ steps.pack.outputs.tgz }}" > /tmp/licence-list.txt
          if ! grep -qE '^package/LICENSE' /tmp/licence-list.txt; then
            echo "::error::tarball contains no LICENSE file"
            exit 1
          fi
          license="$(node -p "require('./' + process.env.PKG_DIR + '/package.json').license ?? ''")"
          if [ -z "$license" ]; then
            echo "::error::package.json declares no license field"
            exit 1
          fi
          echo "licence present: $license"

      # Attest the EXACT file that is about to be uploaded, then upload that same
      # file, so what consumers download is byte-for-byte what was attested.
      # Verify downstream with:
      #   gh attestation verify <tarball>.tgz -R Cogni-DAO/node-template
      - name: Attest the tarball
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tgz }}

      # Anonymous, versioned, and integrity-pinned by the consumer's lockfile.
      # A node depends on it as:
      #   "@cogni/work-items": "https://github.com/cogni-dao/node-template/releases/download/work-items-v<v>/cogni-dao-work-items-<v>.tgz"
      # The alias keeps every existing import path untouched — which is also why
      # the published knowledge packages declare their in-repo peers as `"*"`
      # rather than `workspace:*`: `npm pack` does not rewrite `workspace:`
      # specifiers, so a tarball carrying one cannot be installed at all.
      - name: Attach the tarball to a Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tgz_name="$(basename "${{ steps.pack.outputs.tgz }}")"
          {
            echo "Published build of ${PKG_NAME}. Depend on the tarball URL below;"
            echo "a public repo serves it anonymously, so forks need no credentials (story.5069)."
            echo
            echo "Build provenance is attested. Verify before depending on it:"
            echo "    gh attestation verify ${tgz_name} -R ${GITHUB_REPOSITORY}"
          } > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tgz }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
